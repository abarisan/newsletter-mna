<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — The Deal Brief N°42</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #fdf6ee; color: #2b1a0e;
           margin: 0; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; color: #e85d1a; margin-bottom: 4px; }
    .subtitle { color: #7a5c45; font-size: 13px; margin-bottom: 40px; }
    .question { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px;
                 box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .question h3 { font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
    .option { display: block; width: 100%; text-align: left; background: #fff8f2;
               border: 1px solid #fde0c5; border-radius: 6px; padding: 12px 16px;
               margin-bottom: 8px; cursor: pointer; font-size: 14px; transition: all .15s; }
    .option:hover { background: #fff3e8; border-color: #f9a06b; }
    .option.correct { background: #e6f9ec; border-color: #2ecc71; color: #1a6b3a; }
    .option.wrong   { background: #fdecea; border-color: #e74c3c; color: #7b1c1c; }
    .explanation { display: none; margin-top: 12px; padding: 12px 16px; background: #fff3e8;
                    border-left: 3px solid #e85d1a; font-size: 13px; color: #5a3520;
                    border-radius: 0 6px 6px 0; line-height: 1.6; }
    .score { display: none; text-align: center; padding: 32px; background: #fff;
              border-radius: 8px; box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .score h2 { font-size: 28px; color: #e85d1a; }
    .score p { color: #5a3520; }
    #submit { display: block; width: 100%; padding: 16px; background: #e85d1a; color: #fff;
               border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    #submit:hover { background: #c94e0e; }
  </style>
</head>
<body>
<div class="container">
  <h1>Quiz — N°42</h1>
  <p class="subtitle">The Deal Brief · 07 August 2026 · 4 questions</p>
  <div id="quiz"></div>
  <button id="submit" onclick="submitQuiz()">Voir mes résultats</button>
  <div class="score" id="score"></div>
</div>
<script>
const questions = [{"question": "Quel est l'objectif de l'accord de crédit privé entre Jane Street et des investisseurs, dont Pimco ?", "options": ["A. Augmenter son niveau d’endettement", "B. Réduire son niveau d’endettement", "C. Investir dans des obligations", "D. Créer un nouveau fonds de trading"], "correct": 1, "explanation": "L'accord de crédit privé vise à permettre à Jane Street de réduire son niveau d’endettement et de se recentrer sur les investissements dans l’intelligence artificielle et d’autres technologies."}, {"question": "Quelle est la différence entre la dette sénior et la dette subordonnée ?", "options": ["A. La dette sénior a un taux d’intérêt plus élevé que la dette subordonnée", "B. La dette subordonnée a la priorité sur la dette sénior en cas de défaut", "C. La dette sénior a la priorité sur la dette subordonnée en cas de défaut", "D. Les deux types de dette ont les mêmes caractéristiques"], "correct": 2, "explanation": "La dette sénior a la priorité sur la dette subordonnée en cas de défaut, et elle est généralement plus sécurisée et comporte un taux d’intérêt inférieur. La dette subordonnée a une priorité inférieure et comporte généralement un taux d’intérêt plus élevé pour compenser le risque accru."}, {"question": "Quel est l'impact des taux d’intérêt sur le marché obligataire ?", "options": ["A. Les taux d’intérêt n’ont pas d’impact sur le marché obligataire", "B. Les taux d’intérêt ont un impact faible sur le marché obligataire", "C. Les taux d’intérêt ont un impact significatif sur les rendements des obligations", "D. Les taux d’intérêt réduisent les rendements des obligations"], "correct": 2, "explanation": "Le marché obligataire est très sensible aux taux d’intérêt, et la récente hausse des taux a eu un impact significatif sur les rendements des obligations."}, {"question": "Quel est le rôle de la Banque centrale européenne (BCE) et de la Réserve fédérale américaine en ce qui concerne les taux d’intérêt ?", "options": ["A. Elles fixent les taux d’intérêt de manière arbitraire", "B. Elles surveillent de près l’évolution des taux d’intérêt pour ajuster leurs politiques monétaires", "C. Elles n’ont pas d’influence sur les taux d’intérêt", "D. Elles réduisent les taux d’intérêt de manière continue"], "correct": 1, "explanation": "La Banque centrale européenne (BCE) et la Réserve fédérale américaine surveillent de près l’évolution des taux d’intérêt pour ajuster leurs politiques monétaires."}];
let answered = {};

function buildQuiz() {
  const quiz = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${qi+1}. ${q.question}</h3>` +
      q.options.map((o, oi) =>
        `<button class="option" id="q${qi}_${oi}" onclick="answer(${qi},${oi},${q.correct})">${o}</button>`
      ).join('') +
      `<div class="explanation" id="exp${qi}">${q.explanation}</div>`;
    quiz.appendChild(div);
  });
}

function answer(qi, oi, correct) {
  if (answered[qi] !== undefined) return;
  answered[qi] = oi;
  const btn = document.getElementById(`q${qi}_${oi}`);
  const correctBtn = document.getElementById(`q${qi}_${correct}`);
  btn.classList.add(oi === correct ? 'correct' : 'wrong');
  if (oi !== correct) correctBtn.classList.add('correct');
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitQuiz() {
  const score = Object.values(answered).filter((a, i) => a === questions[i].correct).length;
  const total = questions.length;
  const msg = score === total ? "🏆 Parfait ! Tu maîtrises ce numéro." :
              score >= total/2 ? "👍 Bien, relis les explications des questions ratées." :
              "📖 Relis le cours — ces notions vont revenir en entretien.";
  document.getElementById('score').innerHTML =
    `<h2>${score} / ${total}</h2><p>${msg}</p>`;
  document.getElementById('score').style.display = 'block';
  document.getElementById('submit').style.display = 'none';
  window.scrollTo(0, document.getElementById('score').offsetTop - 20);
}

buildQuiz();
</script>
</body>
</html>
