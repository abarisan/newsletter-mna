<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — The Deal Brief N°48</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #fdf6ee; color: #2b1a0e;
           margin: 0; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; color: #e85d1a; margin-bottom: 4px; }
    .subtitle { color: #7a5c45; font-size: 13px; margin-bottom: 40px; }
    .question { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px;
                 box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .question h3 { font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
    .option { display: block; width: 100%; text-align: left; background: #fff8f2;
               border: 1px solid #fde0c5; border-radius: 6px; padding: 12px 16px;
               margin-bottom: 8px; cursor: pointer; font-size: 14px; transition: all .15s; }
    .option:hover { background: #fff3e8; border-color: #f9a06b; }
    .option.correct { background: #e6f9ec; border-color: #2ecc71; color: #1a6b3a; }
    .option.wrong   { background: #fdecea; border-color: #e74c3c; color: #7b1c1c; }
    .explanation { display: none; margin-top: 12px; padding: 12px 16px; background: #fff3e8;
                    border-left: 3px solid #e85d1a; font-size: 13px; color: #5a3520;
                    border-radius: 0 6px 6px 0; line-height: 1.6; }
    .score { display: none; text-align: center; padding: 32px; background: #fff;
              border-radius: 8px; box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .score h2 { font-size: 28px; color: #e85d1a; }
    .score p { color: #5a3520; }
    #submit { display: block; width: 100%; padding: 16px; background: #e85d1a; color: #fff;
               border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    #submit:hover { background: #c94e0e; }
  </style>
</head>
<body>
<div class="container">
  <h1>Quiz — N°48</h1>
  <p class="subtitle">The Deal Brief · 17 August 2026 · 4 questions</p>
  <div id="quiz"></div>
  <button id="submit" onclick="submitQuiz()">Voir mes résultats</button>
  <div class="score" id="score"></div>
</div>
<script>
const questions = [{"question": "Qu'est-ce qu'un LBO (Leveraged Buyout) ?", "options": ["A. Une stratégie d'acquisition où l'entreprise cible paie intégralement le prix d'acquisition", "B. Une stratégie d'acquisition où une partie significative du financement provient de la dette", "C. Une stratégie d'acquisition où les investisseurs utilisent uniquement leurs fonds propres", "D. Une stratégie d'acquisition où l'entreprise cible est détenue à 100% par les investisseurs"], "correct": 1, "explanation": "Un LBO est une stratégie d'acquisition où une partie significative du financement provient de la dette, avec l'objectif de renverser la structure de propriété de l'entreprise cible. C'est pourquoi l'option B est la bonne réponse. Les options A, C et D sont fausses car elles ne correspondent pas à la définition d'un LBO."}, {"question": "Quel est le pourcentage de détention de la dette dans le deal EA ?", "options": ["A. 30%", "B. 50%", "C. 67%", "D. 90%"], "correct": 2, "explanation": "D'après le texte, la dette senior représente 67% du prix d'acquisition total, soit 800 millions d'euros sur un total de 1,2 milliard d'euros. L'option C est donc la bonne réponse. Les options A, B et D sont fausses car elles ne correspondent pas aux chiffres donnés dans le texte."}, {"question": "Qu'est-ce que les covenants dans le contexte d'un LBO ?", "options": ["A. Des accords entre l'entreprise emprunteuse et les prêteurs pour garantir que l'entreprise respecte certaines conditions financières", "B. Des accords entre les investisseurs et l'entreprise cible pour déterminer le prix d'acquisition", "C. Des accords entre les prêteurs et les investisseurs pour déterminer le taux d'intérêt de la dette", "D. Des accords entre l'entreprise cible et les régulateurs pour déterminer les conditions de l'acquisition"], "correct": 0, "explanation": "Les covenants sont des accords entre l'entreprise emprunteuse et les prêteurs pour garantir que l'entreprise respecte certaines conditions financières, comme un ratio dette/capitaux propres maximum, pour assurer la capacité de remboursement de la dette. L'option A est donc la bonne réponse. Les options B, C et D sont fausses car elles ne correspondent pas à la définition des covenants dans le contexte d'un LBO."}, {"question": "Quel est l'impact potentiel de la sécheresse extrême en Europe sur les décisions d'investissement et de fusions-acquisitions ?", "options": ["A. Aucun impact", "B. Un impact positif sur les secteurs sensibles au climat", "C. Un impact négatif sur les secteurs sensibles au climat et à la disponibilité des ressources naturelles", "D. Un impact neutre sur tous les secteurs"], "correct": 2, "explanation": "D'après le texte, la sécheresse extrême en Europe pourrait influencer les décisions d'investissement et de fusions-acquisitions, en particulier dans les secteurs sensibles au climat et à la disponibilité des ressources naturelles. L'option C est donc la bonne réponse. Les options A, B et D sont fausses car elles ne correspondent pas à l'analyse donnée dans le texte."}];
let answered = {};

function buildQuiz() {
  const quiz = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${qi+1}. ${q.question}</h3>` +
      q.options.map((o, oi) =>
        `<button class="option" id="q${qi}_${oi}" onclick="answer(${qi},${oi},${q.correct})">${o}</button>`
      ).join('') +
      `<div class="explanation" id="exp${qi}">${q.explanation}</div>`;
    quiz.appendChild(div);
  });
}

function answer(qi, oi, correct) {
  if (answered[qi] !== undefined) return;
  answered[qi] = oi;
  const btn = document.getElementById(`q${qi}_${oi}`);
  const correctBtn = document.getElementById(`q${qi}_${correct}`);
  btn.classList.add(oi === correct ? 'correct' : 'wrong');
  if (oi !== correct) correctBtn.classList.add('correct');
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitQuiz() {
  const score = Object.values(answered).filter((a, i) => a === questions[i].correct).length;
  const total = questions.length;
  const msg = score === total ? "🏆 Parfait ! Tu maîtrises ce numéro." :
              score >= total/2 ? "👍 Bien, relis les explications des questions ratées." :
              "📖 Relis le cours — ces notions vont revenir en entretien.";
  document.getElementById('score').innerHTML =
    `<h2>${score} / ${total}</h2><p>${msg}</p>`;
  document.getElementById('score').style.display = 'block';
  document.getElementById('submit').style.display = 'none';
  window.scrollTo(0, document.getElementById('score').offsetTop - 20);
}

buildQuiz();
</script>
</body>
</html>
