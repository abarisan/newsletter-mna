<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — The Deal Brief N°33</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #fdf6ee; color: #2b1a0e;
           margin: 0; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; color: #e85d1a; margin-bottom: 4px; }
    .subtitle { color: #7a5c45; font-size: 13px; margin-bottom: 40px; }
    .question { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px;
                 box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .question h3 { font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
    .option { display: block; width: 100%; text-align: left; background: #fff8f2;
               border: 1px solid #fde0c5; border-radius: 6px; padding: 12px 16px;
               margin-bottom: 8px; cursor: pointer; font-size: 14px; transition: all .15s; }
    .option:hover { background: #fff3e8; border-color: #f9a06b; }
    .option.correct { background: #e6f9ec; border-color: #2ecc71; color: #1a6b3a; }
    .option.wrong   { background: #fdecea; border-color: #e74c3c; color: #7b1c1c; }
    .explanation { display: none; margin-top: 12px; padding: 12px 16px; background: #fff3e8;
                    border-left: 3px solid #e85d1a; font-size: 13px; color: #5a3520;
                    border-radius: 0 6px 6px 0; line-height: 1.6; }
    .score { display: none; text-align: center; padding: 32px; background: #fff;
              border-radius: 8px; box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .score h2 { font-size: 28px; color: #e85d1a; }
    .score p { color: #5a3520; }
    #submit { display: block; width: 100%; padding: 16px; background: #e85d1a; color: #fff;
               border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    #submit:hover { background: #c94e0e; }
  </style>
</head>
<body>
<div class="container">
  <h1>Quiz — N°33</h1>
  <p class="subtitle">The Deal Brief · 27 July 2026 · 4 questions</p>
  <div id="quiz"></div>
  <button id="submit" onclick="submitQuiz()">Voir mes résultats</button>
  <div class="score" id="score"></div>
</div>
<script>
const questions = [{"question": "Quel est le pourcentage de bond avec lequel CXMT, le géant chinois des puces de mémoire, a démarré son activité boursière sur le marché de Shanghai ?", "options": ["A. 200%", "B. 300%", "C. 466%", "D. 500%"], "correct": 2, "explanation": "La bonne réponse est C. 466%, car selon les données récentes de Bloomberg, CXMT a démarré son activité boursière sur le marché de Shanghai avec un bond spectacululaire de 466%. Les autres options sont incorrectes car elles ne correspondent pas aux données fournies."}, {"question": "Qu'est-ce que le concept de Working Capital dans le contexte d'une entreprise ?", "options": ["A. La différence entre les passifs courants et les actifs à long terme", "B. La différence entre les actifs courants et les passifs courants", "C. La somme des actifs courants et des passifs courants", "D. La différence entre les ventes et les achats"], "correct": 1, "explanation": "La bonne réponse est B. La différence entre les actifs courants et les passifs courants, car le concept de Working Capital fait référence à la capacité d'une entreprise à financer ses activités quotidiennes et ses obligations à court terme. Les autres options sont incorrectes car elles ne correspondent pas à la définition du Working Capital."}, {"question": "Qu'est-ce que le flux de trésorerie dans le contexte d'une entreprise ?", "options": ["A. Les mouvements d'entrées et de sorties de fonds dans une entreprise", "B. Les ventes et les achats d'une entreprise", "C. Les investissements et les dividendes d'une entreprise", "D. Les impôts et les taxes d'une entreprise"], "correct": 0, "explanation": "La bonne réponse est A. Les mouvements d'entrées et de sorties de fonds dans une entreprise, car le flux de trésorerie désigne les mouvements d'entrées et de sorties de fonds au sein d'une entreprise. Les autres options sont incorrectes car elles ne correspondent pas à la définition du flux de trésorerie."}, {"question": "Quel est l'impact des tensions géopolitiques, telles que la guerre commerciale entre les États-Unis et l'Iran, sur les marchés financiers ?", "options": ["A. Une augmentation de la stabilité des prix du pétrole", "B. Une diminution de la volatilité des marchés financiers", "C. Une augmentation de la volatilité des prix du pétrole et des coûts de production", "D. Une diminution de l'impact sur les coûts de production et les prix des biens"], "correct": 2, "explanation": "La bonne réponse est C. Une augmentation de la volatilité des prix du pétrole et des coûts de production, car les tensions géopolitiques, telles que la guerre commerciale entre les États-Unis et l'Iran, ont des répercussions significatives sur les marchés financiers mondiaux, notamment une augmentation de la volatilité des prix du pétrole et des coûts de production. Les autres options sont incorrectes car elles ne correspondent pas aux informations fournies."}];
let answered = {};

function buildQuiz() {
  const quiz = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${qi+1}. ${q.question}</h3>` +
      q.options.map((o, oi) =>
        `<button class="option" id="q${qi}_${oi}" onclick="answer(${qi},${oi},${q.correct})">${o}</button>`
      ).join('') +
      `<div class="explanation" id="exp${qi}">${q.explanation}</div>`;
    quiz.appendChild(div);
  });
}

function answer(qi, oi, correct) {
  if (answered[qi] !== undefined) return;
  answered[qi] = oi;
  const btn = document.getElementById(`q${qi}_${oi}`);
  const correctBtn = document.getElementById(`q${qi}_${correct}`);
  btn.classList.add(oi === correct ? 'correct' : 'wrong');
  if (oi !== correct) correctBtn.classList.add('correct');
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitQuiz() {
  const score = Object.values(answered).filter((a, i) => a === questions[i].correct).length;
  const total = questions.length;
  const msg = score === total ? "🏆 Parfait ! Tu maîtrises ce numéro." :
              score >= total/2 ? "👍 Bien, relis les explications des questions ratées." :
              "📖 Relis le cours — ces notions vont revenir en entretien.";
  document.getElementById('score').innerHTML =
    `<h2>${score} / ${total}</h2><p>${msg}</p>`;
  document.getElementById('score').style.display = 'block';
  document.getElementById('submit').style.display = 'none';
  window.scrollTo(0, document.getElementById('score').offsetTop - 20);
}

buildQuiz();
</script>
</body>
</html>
