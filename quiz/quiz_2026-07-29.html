<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — The Deal Brief N°35</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #fdf6ee; color: #2b1a0e;
           margin: 0; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; color: #e85d1a; margin-bottom: 4px; }
    .subtitle { color: #7a5c45; font-size: 13px; margin-bottom: 40px; }
    .question { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px;
                 box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .question h3 { font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
    .option { display: block; width: 100%; text-align: left; background: #fff8f2;
               border: 1px solid #fde0c5; border-radius: 6px; padding: 12px 16px;
               margin-bottom: 8px; cursor: pointer; font-size: 14px; transition: all .15s; }
    .option:hover { background: #fff3e8; border-color: #f9a06b; }
    .option.correct { background: #e6f9ec; border-color: #2ecc71; color: #1a6b3a; }
    .option.wrong   { background: #fdecea; border-color: #e74c3c; color: #7b1c1c; }
    .explanation { display: none; margin-top: 12px; padding: 12px 16px; background: #fff3e8;
                    border-left: 3px solid #e85d1a; font-size: 13px; color: #5a3520;
                    border-radius: 0 6px 6px 0; line-height: 1.6; }
    .score { display: none; text-align: center; padding: 32px; background: #fff;
              border-radius: 8px; box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .score h2 { font-size: 28px; color: #e85d1a; }
    .score p { color: #5a3520; }
    #submit { display: block; width: 100%; padding: 16px; background: #e85d1a; color: #fff;
               border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    #submit:hover { background: #c94e0e; }
  </style>
</head>
<body>
<div class="container">
  <h1>Quiz — N°35</h1>
  <p class="subtitle">The Deal Brief · 29 July 2026 · 4 questions</p>
  <div id="quiz"></div>
  <button id="submit" onclick="submitQuiz()">Voir mes résultats</button>
  <div class="score" id="score"></div>
</div>
<script>
const questions = [{"question": "Qu'est-ce que l'EPS (Earnings Per Share) et comment est-il calculé ?", "options": ["A. L'EPS est calculé en divisant le chiffre d'affaires par le nombre d'actions en circulation", "B. L'EPS est calculé en divisant le bénéfice net par le nombre d'actions en circulation", "C. L'EPS est calculé en divisant les coûts par le nombre d'actions en circulation", "D. L'EPS est calculé en divisant les dettes par le nombre d'actions en circulation"], "correct": 1, "explanation": "L'EPS est calculé en divisant le bénéfice net de l'entreprise par le nombre d'actions en circulation, ce qui donne une idée de la rentabilité de l'entreprise par action."}, {"question": "Qu'est-ce que le Diluted EPS et comment diffère-t-il de l'EPS ?", "options": ["A. Le Diluted EPS est calculé en divisant le bénéfice net par le nombre d'actions en circulation, sans tenir compte des actions potentielles", "B. Le Diluted EPS est calculé en divisant le bénéfice net par le nombre d'actions en circulation, en tenant compte des actions potentielles", "C. Le Diluted EPS est calculé en divisant le chiffre d'affaires par le nombre d'actions en circulation", "D. Le Diluted EPS est calculé en divisant les coûts par le nombre d'actions en circulation"], "correct": 1, "explanation": "Le Diluted EPS prend en compte les actions potentielles qui pourraient être émises dans le futur, comme les options d'achat d'actions ou les warrants, ce qui permet d'avoir une vision plus réaliste de la rentabilité de l'entreprise par action."}, {"question": "Quel est l'impact de la guerre en Ukraine sur le marché énergétique mondial ?", "options": ["A. La guerre en Ukraine a entraîné des baisses de prix et des surplus d'énergie", "B. La guerre en Ukraine n'a pas eu d'impact sur le marché énergétique mondial", "C. La guerre en Ukraine a entraîné des pénuries d'énergie et des hausses de prix", "D. La guerre en Ukraine a entraîné des changements dans la structure du marché énergétique mondial, mais sans impact sur les prix"], "correct": 2, "explanation": "La guerre en Ukraine a entraîné des pénuries d'énergie et des hausses de prix, ce qui affecte non seulement l'Ukraine mais aussi les pays voisins et l'économie mondiale."}, {"question": "Quel est le prix d'acquisition de Beyond Meat par le fonds d'investissement ?", "options": ["A. 5 milliards de dollars", "B. 10 milliards de dollars", "C. 15 milliards de dollars", "D. 20 milliards de dollars"], "correct": 1, "explanation": "Le prix d'acquisition de Beyond Meat par le fonds d'investissement est de 10 milliards de dollars, avec une prime de 20% par rapport au cours de bourse précédent."}];
let answered = {};

function buildQuiz() {
  const quiz = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${qi+1}. ${q.question}</h3>` +
      q.options.map((o, oi) =>
        `<button class="option" id="q${qi}_${oi}" onclick="answer(${qi},${oi},${q.correct})">${o}</button>`
      ).join('') +
      `<div class="explanation" id="exp${qi}">${q.explanation}</div>`;
    quiz.appendChild(div);
  });
}

function answer(qi, oi, correct) {
  if (answered[qi] !== undefined) return;
  answered[qi] = oi;
  const btn = document.getElementById(`q${qi}_${oi}`);
  const correctBtn = document.getElementById(`q${qi}_${correct}`);
  btn.classList.add(oi === correct ? 'correct' : 'wrong');
  if (oi !== correct) correctBtn.classList.add('correct');
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitQuiz() {
  const score = Object.values(answered).filter((a, i) => a === questions[i].correct).length;
  const total = questions.length;
  const msg = score === total ? "🏆 Parfait ! Tu maîtrises ce numéro." :
              score >= total/2 ? "👍 Bien, relis les explications des questions ratées." :
              "📖 Relis le cours — ces notions vont revenir en entretien.";
  document.getElementById('score').innerHTML =
    `<h2>${score} / ${total}</h2><p>${msg}</p>`;
  document.getElementById('score').style.display = 'block';
  document.getElementById('submit').style.display = 'none';
  window.scrollTo(0, document.getElementById('score').offsetTop - 20);
}

buildQuiz();
</script>
</body>
</html>
