<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — The Deal Brief N°36</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #fdf6ee; color: #2b1a0e;
           margin: 0; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; color: #e85d1a; margin-bottom: 4px; }
    .subtitle { color: #7a5c45; font-size: 13px; margin-bottom: 40px; }
    .question { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px;
                 box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .question h3 { font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
    .option { display: block; width: 100%; text-align: left; background: #fff8f2;
               border: 1px solid #fde0c5; border-radius: 6px; padding: 12px 16px;
               margin-bottom: 8px; cursor: pointer; font-size: 14px; transition: all .15s; }
    .option:hover { background: #fff3e8; border-color: #f9a06b; }
    .option.correct { background: #e6f9ec; border-color: #2ecc71; color: #1a6b3a; }
    .option.wrong   { background: #fdecea; border-color: #e74c3c; color: #7b1c1c; }
    .explanation { display: none; margin-top: 12px; padding: 12px 16px; background: #fff3e8;
                    border-left: 3px solid #e85d1a; font-size: 13px; color: #5a3520;
                    border-radius: 0 6px 6px 0; line-height: 1.6; }
    .score { display: none; text-align: center; padding: 32px; background: #fff;
              border-radius: 8px; box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .score h2 { font-size: 28px; color: #e85d1a; }
    .score p { color: #5a3520; }
    #submit { display: block; width: 100%; padding: 16px; background: #e85d1a; color: #fff;
               border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    #submit:hover { background: #c94e0e; }
  </style>
</head>
<body>
<div class="container">
  <h1>Quiz — N°36</h1>
  <p class="subtitle">The Deal Brief · 30 July 2026 · 4 questions</p>
  <div id="quiz"></div>
  <button id="submit" onclick="submitQuiz()">Voir mes résultats</button>
  <div class="score" id="score"></div>
</div>
<script>
const questions = [{"question": "Quel est l'objectif principal de ByteDance en annonçant son plan pour dominer le marché de l'intelligence artificielle ?", "options": ["A. Réduire les coûts de production", "B. Améliorer la personnalisation des services pour les utilisateurs", "C. Développer de nouveaux produits", "D. Augmenter les ventes de TikTok"], "correct": 1, "explanation": "La bonne réponse est B, car ByteDance cherche à accroître sa capacité à innover et à offrir des services plus personnalisés à ses utilisateurs en acquérant et en intégrant des sociétés spécialisées dans l'AI. Les autres options ne sont pas directement liées à l'objectif principal de ByteDance."}, {"question": "Qu'est-ce que la consolidation dans le contexte des comptes de groupe ?", "options": ["A. Le processus de fusion de deux sociétés", "B. Le processus de combinaison des états financiers de plusieurs sociétés pour présenter un tableau financier global", "C. Le processus de réduction des coûts de production", "D. Le processus de développement de nouveaux produits"], "correct": 1, "explanation": "La bonne réponse est B, car la consolidation est le processus par lequel une entreprise mère combine les états financiers de ses filiales pour présenter un tableau financier global de l’ensemble du groupe. Les autres options ne décrivent pas correctement la consolidation."}, {"question": "Quel est l'impact de la décision de la Fed de maintenir les taux d'intérêt sur les marchés financiers ?", "options": ["A. Une réduction des coûts d'emprunt pour les entreprises", "B. Une augmentation des coûts d'emprunt pour les entreprises", "C. Une stabilisation des marchés financiers", "D. Une récession économique"], "correct": 1, "explanation": "La bonne réponse est B, car la décision de la Fed de maintenir les taux d'intérêt a entraîné une augmentation des coûts d'emprunt pour les entreprises, comme mentionné dans l'article. Les autres options ne décrivent pas correctement l'impact de la décision de la Fed."}, {"question": "Quelles sont les méthodes de consolidation couramment utilisées ?", "options": ["A. La consolidation globale et la consolidation proportionnelle", "B. La méthode de l’investissement et la consolidation globale", "C. La consolidation proportionnelle, la méthode de l’investissement et la consolidation globale", "D. La méthode de l’investissement seule"], "correct": 2, "explanation": "La bonne réponse est C, car les méthodes de consolidation couramment utilisées incluent la consolidation globale, la consolidation proportionnelle et la méthode de l’investissement. Les autres options ne décrivent pas correctement les méthodes de consolidation couramment utilisées."}];
let answered = {};

function buildQuiz() {
  const quiz = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${qi+1}. ${q.question}</h3>` +
      q.options.map((o, oi) =>
        `<button class="option" id="q${qi}_${oi}" onclick="answer(${qi},${oi},${q.correct})">${o}</button>`
      ).join('') +
      `<div class="explanation" id="exp${qi}">${q.explanation}</div>`;
    quiz.appendChild(div);
  });
}

function answer(qi, oi, correct) {
  if (answered[qi] !== undefined) return;
  answered[qi] = oi;
  const btn = document.getElementById(`q${qi}_${oi}`);
  const correctBtn = document.getElementById(`q${qi}_${correct}`);
  btn.classList.add(oi === correct ? 'correct' : 'wrong');
  if (oi !== correct) correctBtn.classList.add('correct');
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitQuiz() {
  const score = Object.values(answered).filter((a, i) => a === questions[i].correct).length;
  const total = questions.length;
  const msg = score === total ? "🏆 Parfait ! Tu maîtrises ce numéro." :
              score >= total/2 ? "👍 Bien, relis les explications des questions ratées." :
              "📖 Relis le cours — ces notions vont revenir en entretien.";
  document.getElementById('score').innerHTML =
    `<h2>${score} / ${total}</h2><p>${msg}</p>`;
  document.getElementById('score').style.display = 'block';
  document.getElementById('submit').style.display = 'none';
  window.scrollTo(0, document.getElementById('score').offsetTop - 20);
}

buildQuiz();
</script>
</body>
</html>
