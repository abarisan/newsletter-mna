<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — The Deal Brief N°44</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #fdf6ee; color: #2b1a0e;
           margin: 0; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; color: #e85d1a; margin-bottom: 4px; }
    .subtitle { color: #7a5c45; font-size: 13px; margin-bottom: 40px; }
    .question { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px;
                 box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .question h3 { font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
    .option { display: block; width: 100%; text-align: left; background: #fff8f2;
               border: 1px solid #fde0c5; border-radius: 6px; padding: 12px 16px;
               margin-bottom: 8px; cursor: pointer; font-size: 14px; transition: all .15s; }
    .option:hover { background: #fff3e8; border-color: #f9a06b; }
    .option.correct { background: #e6f9ec; border-color: #2ecc71; color: #1a6b3a; }
    .option.wrong   { background: #fdecea; border-color: #e74c3c; color: #7b1c1c; }
    .explanation { display: none; margin-top: 12px; padding: 12px 16px; background: #fff3e8;
                    border-left: 3px solid #e85d1a; font-size: 13px; color: #5a3520;
                    border-radius: 0 6px 6px 0; line-height: 1.6; }
    .score { display: none; text-align: center; padding: 32px; background: #fff;
              border-radius: 8px; box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .score h2 { font-size: 28px; color: #e85d1a; }
    .score p { color: #5a3520; }
    #submit { display: block; width: 100%; padding: 16px; background: #e85d1a; color: #fff;
               border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    #submit:hover { background: #c94e0e; }
  </style>
</head>
<body>
<div class="container">
  <h1>Quiz — N°44</h1>
  <p class="subtitle">The Deal Brief · 11 August 2026 · 4 questions</p>
  <div id="quiz"></div>
  <button id="submit" onclick="submitQuiz()">Voir mes résultats</button>
  <div class="score" id="score"></div>
</div>
<script>
const questions = [{"question": "Quel est le rôle des multiples dans l'évaluation d'entreprises ?", "options": ["A. Déterminer le prix de vente d'une entreprise", "B. Comparer la valeur d'une entreprise à une mesure de sa performance", "C. Évaluer la rentabilité d'une entreprise", "D. Prévoir les tendances du marché"], "correct": 1, "explanation": "Les multiples sont des ratios qui comparent la valeur d'une entreprise à une mesure de sa performance, telle que le chiffre d'affaires ou le bénéfice net. Ils permettent de comparer la valorisation d'une entreprise par rapport à ses pairs et de déterminer sa valeur relative."}, {"question": "Qu'est-ce que le multiple de prix/chiffre d'affaires ?", "options": ["A. Le rapport entre le prix d'une action et le bénéfice par action", "B. Le rapport entre le prix d'une action et le chiffre d'affaires par action", "C. Le rapport entre le chiffre d'affaires et le bénéfice net", "D. Le rapport entre le bénéfice net et le prix d'une action"], "correct": 1, "explanation": "Le multiple de prix/chiffre d'affaires est le rapport entre le prix d'une action et le chiffre d'affaires par action de l'entreprise. Il est utilisé pour comparer la valorisation d'une entreprise par rapport à ses pairs."}, {"question": "Quel est l'impact de la politique monétaire sur les marchés financiers ?", "options": ["A. Elle a un impact négatif sur les prix des actions", "B. Elle a un impact positif sur les prix des obligations", "C. Elle influence directement le coût du capital pour les entreprises et leur capacité à lever des fonds", "D. Elle n'a pas d'impact sur les marchés financiers"], "correct": 2, "explanation": "La politique monétaire, menée par les banques centrales, a un impact significatif sur les marchés financiers. Les décisions concernant les taux d'intérêt et la quantité de monnaie en circulation influencent directement le coût du capital pour les entreprises, leur capacité à lever des fonds et, en fin de compte, leur valorisation."}, {"question": "Pourquoi l'évaluation des entreprises est-elle importante dans les activités de fusions et acquisitions (M&A) ?", "options": ["A. Pour déterminer le prix de vente d'une entreprise", "B. Pour évaluer la rentabilité d'une entreprise", "C. Pour permettre aux parties prenantes de déterminer la valeur d'une entreprise et de négocier des prix justes pour les transactions", "D. Pour prévoir les tendances du marché"], "correct": 2, "explanation": "L'évaluation des entreprises est un aspect crucial des activités de M&A, car elle permet aux parties prenantes de déterminer la valeur d'une entreprise et de négocier des prix justes pour les transactions. Cela est essentiel pour garantir que les transactions soient équitables et que les parties impliquées soient satisfaites."}];
let answered = {};

function buildQuiz() {
  const quiz = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${qi+1}. ${q.question}</h3>` +
      q.options.map((o, oi) =>
        `<button class="option" id="q${qi}_${oi}" onclick="answer(${qi},${oi},${q.correct})">${o}</button>`
      ).join('') +
      `<div class="explanation" id="exp${qi}">${q.explanation}</div>`;
    quiz.appendChild(div);
  });
}

function answer(qi, oi, correct) {
  if (answered[qi] !== undefined) return;
  answered[qi] = oi;
  const btn = document.getElementById(`q${qi}_${oi}`);
  const correctBtn = document.getElementById(`q${qi}_${correct}`);
  btn.classList.add(oi === correct ? 'correct' : 'wrong');
  if (oi !== correct) correctBtn.classList.add('correct');
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitQuiz() {
  const score = Object.values(answered).filter((a, i) => a === questions[i].correct).length;
  const total = questions.length;
  const msg = score === total ? "🏆 Parfait ! Tu maîtrises ce numéro." :
              score >= total/2 ? "👍 Bien, relis les explications des questions ratées." :
              "📖 Relis le cours — ces notions vont revenir en entretien.";
  document.getElementById('score').innerHTML =
    `<h2>${score} / ${total}</h2><p>${msg}</p>`;
  document.getElementById('score').style.display = 'block';
  document.getElementById('submit').style.display = 'none';
  window.scrollTo(0, document.getElementById('score').offsetTop - 20);
}

buildQuiz();
</script>
</body>
</html>
