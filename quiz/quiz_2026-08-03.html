<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — The Deal Brief N°38</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #fdf6ee; color: #2b1a0e;
           margin: 0; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; color: #e85d1a; margin-bottom: 4px; }
    .subtitle { color: #7a5c45; font-size: 13px; margin-bottom: 40px; }
    .question { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px;
                 box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .question h3 { font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
    .option { display: block; width: 100%; text-align: left; background: #fff8f2;
               border: 1px solid #fde0c5; border-radius: 6px; padding: 12px 16px;
               margin-bottom: 8px; cursor: pointer; font-size: 14px; transition: all .15s; }
    .option:hover { background: #fff3e8; border-color: #f9a06b; }
    .option.correct { background: #e6f9ec; border-color: #2ecc71; color: #1a6b3a; }
    .option.wrong   { background: #fdecea; border-color: #e74c3c; color: #7b1c1c; }
    .explanation { display: none; margin-top: 12px; padding: 12px 16px; background: #fff3e8;
                    border-left: 3px solid #e85d1a; font-size: 13px; color: #5a3520;
                    border-radius: 0 6px 6px 0; line-height: 1.6; }
    .score { display: none; text-align: center; padding: 32px; background: #fff;
              border-radius: 8px; box-shadow: 0 2px 8px rgba(232,93,26,0.08); }
    .score h2 { font-size: 28px; color: #e85d1a; }
    .score p { color: #5a3520; }
    #submit { display: block; width: 100%; padding: 16px; background: #e85d1a; color: #fff;
               border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    #submit:hover { background: #c94e0e; }
  </style>
</head>
<body>
<div class="container">
  <h1>Quiz — N°38</h1>
  <p class="subtitle">The Deal Brief · 03 August 2026 · 4 questions</p>
  <div id="quiz"></div>
  <button id="submit" onclick="submitQuiz()">Voir mes résultats</button>
  <div class="score" id="score"></div>
</div>
<script>
const questions = [{"question": "Quel est le montant approximatif du tie-up entre AstraZeneca et Bristol Myers Squibb ?", "options": ["A. 100 milliards de dollars", "B. 200 milliards de dollars", "C. 400 milliards de dollars", "D. 500 milliards de dollars"], "correct": 2, "explanation": "Le tie-up entre AstraZeneca et Bristol Myers Squibb est estimé à 400 milliards de dollars, ce qui permettrait de créer un nouveau géant dans le secteur pharmaceutique. Les autres options sont inférieures ou supérieures à cette valeur."}, {"question": "Qu'est-ce que les synergies dans les opérations de fusions-acquisitions ?", "options": ["A. Les coûts de transaction", "B. Les avantages qui résultent de la combinaison de deux ou plusieurs entreprises", "C. Les risques financiers", "D. Les pertes d'emplois"], "correct": 1, "explanation": "Les synergies désignent les avantages qui résultent de la combinaison de deux ou plusieurs entreprises, tels que des économies d'échelle, une réduction des coûts ou une amélioration de la compétitivité. Les autres options ne sont pas correctes car elles ne définissent pas les synergies."}, {"question": "Quels sont les facteurs clés qui influencent la croissance et la performance financière d'une entreprise dans le contexte d'une fusion ?", "options": ["A. Les synergies", "B. Les drivers", "C. Les coûts de transaction", "D. Les risques financiers"], "correct": 1, "explanation": "Les drivers sont les facteurs clés qui influencent la croissance et la performance financière d'une entreprise. Dans le contexte d'une fusion, comprendre ces drivers est crucial pour anticiper les résultats de l'opération. Les autres options ne sont pas correctes car elles ne définissent pas les drivers."}, {"question": "Quels sont les défis auxquels les entreprises doivent faire face dans le contexte macro-économique actuel ?", "options": ["A. Les changements climatiques et la stabilité économique", "B. Les fluctuations des marchés financiers", "C. Les risques géopolitiques", "D. Les pertes d'emplois"], "correct": 0, "explanation": "Le contexte macro-économique actuel est marqué par des défis liés aux changements climatiques et à la stabilité économique. Les entreprises doivent adapter leurs stratégies pour tenir compte de ces facteurs. Les autres options ne sont pas correctes car elles ne définissent pas les défis auxquels les entreprises doivent faire face dans le contexte macro-économique actuel."}];
let answered = {};

function buildQuiz() {
  const quiz = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${qi+1}. ${q.question}</h3>` +
      q.options.map((o, oi) =>
        `<button class="option" id="q${qi}_${oi}" onclick="answer(${qi},${oi},${q.correct})">${o}</button>`
      ).join('') +
      `<div class="explanation" id="exp${qi}">${q.explanation}</div>`;
    quiz.appendChild(div);
  });
}

function answer(qi, oi, correct) {
  if (answered[qi] !== undefined) return;
  answered[qi] = oi;
  const btn = document.getElementById(`q${qi}_${oi}`);
  const correctBtn = document.getElementById(`q${qi}_${correct}`);
  btn.classList.add(oi === correct ? 'correct' : 'wrong');
  if (oi !== correct) correctBtn.classList.add('correct');
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitQuiz() {
  const score = Object.values(answered).filter((a, i) => a === questions[i].correct).length;
  const total = questions.length;
  const msg = score === total ? "🏆 Parfait ! Tu maîtrises ce numéro." :
              score >= total/2 ? "👍 Bien, relis les explications des questions ratées." :
              "📖 Relis le cours — ces notions vont revenir en entretien.";
  document.getElementById('score').innerHTML =
    `<h2>${score} / ${total}</h2><p>${msg}</p>`;
  document.getElementById('score').style.display = 'block';
  document.getElementById('submit').style.display = 'none';
  window.scrollTo(0, document.getElementById('score').offsetTop - 20);
}

buildQuiz();
</script>
</body>
</html>
